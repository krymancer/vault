syntax = "proto3";

package vault.v1;

option csharp_namespace = "Vault.Api.Protos";
option go_package = "vault/cli/protos";

message Secret {
  string id = 1;
  string version = 2;
  bytes ciphertext = 3; 
  bytes nonce = 4;
}

message GetSecretRequest {
  string secret_id = 1;
}

service VaultService {
  rpc GetSecret(GetSecretRequest) returns (Secret);
}