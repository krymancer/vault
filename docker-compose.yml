services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "5045:5045"
    environment:
      - ConnectionStrings__Default=Host=postgres;Database=vault;Username=vault;Password=vault
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    environment:
      - VAULT_ADDR=http://api:5045
    profiles:
      - tools

volumes:
  pgdata:
